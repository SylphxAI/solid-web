name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  verify:
    # Do not emit the required check name when admission is refused: skipped jobs can count as success.
    name: ${{ (github.repository_id == '1473701321' && github.event.repository.visibility == 'public') && 'ci-ok' || 'ci-not-admitted' }}
    if: ${{ github.repository_id == '1473701321' && github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.23.5'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm exec -- playwright install --with-deps --only-shell chromium
      - run: npm run verify
